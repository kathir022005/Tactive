name: EquipFlow CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: 🏗️ Build & Run Test Suite
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb+srv://kathirashok255:Akkathir2005@cluster0.ly7x9.mongodb.net/equipflow?appName=Cluster0
      JWT_SECRET: equipflow_super_secret_jwt_key_2024
      NODE_ENV: test
      PORT: 3000

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Client & Server
        run: npm run build

      - name: 🧪 Run API Unit & Integration Tests (Vitest) — GREEN RUN (21/21)
        run: npm run test:unit

      - name: 🔴 Run Deliberate Red Run (Failure Evidence)
        run: npm run test:red || true

      - name: 📄 Upload Red Run Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-run-report
          path: docs/RED_RUN_REPORT.md

      - name: ✅ Test Summary
        run: echo "All stages passed — Build ✓ | Tests ✓ (21/21) | Red Run Evidence ✓ | Live → https://tactive.onrender.com/"
