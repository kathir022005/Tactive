name: EquipFlow CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: 🏗️ Build & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Client & Server
        run: npm run build

      - name: 🧪 Run API Unit & Integration Tests (Vitest)
        run: npm run test:unit

      - name: 🔴 Run Deliberate Red Run (Failure Evidence)
        run: npm run test:red

      - name: 📄 Upload Red Run Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-run-report
          path: docs/RED_RUN_REPORT.md

      - name: ✅ Test Summary
        run: echo "All stages passed — Build ✓ | Tests ✓ | Red Run ✓"
